name: Doc preview cleanup

# Removes the documentation preview of a closed pull request from gh-pages, and squashes the branch history so that
# old previews do not accumulate in it.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: docs-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - name: Delete the preview and squash the history
        env:
          PRNUM: ${{ github.event.number }}
        run: |
          if [ -d "previews/PR$PRNUM" ]; then
            git config user.name "Documenter.jl"
            git config user.email "documenter@juliadocs.github.io"
            git rm -rf "previews/PR$PRNUM"
            git commit -m "delete preview"
            git branch gh-pages-new $(echo "delete history" | git commit-tree HEAD^{tree})
            git push --force origin gh-pages-new:gh-pages
          fi
