name: WaterLily benchmarks
description: Benchmark two refs of a WaterLily.jl checkout and report the compare.jl table (job summary, artifact, PR comment).
author: WaterLily-jl

inputs:
  waterlily-dir:
    description: WaterLily.jl checkout containing both refs.
    default: ${{ github.workspace }}
  base:
    description: Reference ref, the Δ ± σ reference row of each backend.
    default: master
  head:
    description: Ref compared with base, e.g. pr-123.
    required: true
  args:
    description: benchmark.sh arguments appended to the defaults `-b Array -t "1 2" -r 2` (a later value wins), restricted to [A-Za-z0-9 ,._="-].
    default: ""
  force:
    description: Pass -f (skip the machine check), for shared runners.
    default: "true"
  julia-version:
    description: For julia-actions/setup-julia.
    default: "1.11"
  harness-ref:
    description: WaterLily-Benchmarks ref to run. Defaults to this action's ref.
    default: ${{ github.action_ref }}
  harness-path:
    description: Checkout path of WaterLily-Benchmarks, relative to the workspace.
    default: WaterLily-Benchmarks
  pr:
    description: Pull request to comment on, one comment per label that later runs update. Empty posts nothing.
    default: ""
  label:
    description: Name of the comment, e.g. cpu or gpu.
    default: ""
  artifact:
    description: Artifact with the JSON results and the report. Empty uploads nothing.
    default: benchmark-results
  token:
    description: Token with pull-requests write permission, used only to comment.
    default: ${{ github.token }}

outputs:
  report:
    description: Path of the markdown report.
    value: ${{ steps.compare.outputs.report }}
  data:
    description: Directory of the JSON results.
    value: ${{ steps.compare.outputs.data }}

runs:
  using: composite
  steps:
    - name: Check out WaterLily-Benchmarks (LFS checkpoints as pointers, fetched by benchmark.sh)
      uses: actions/checkout@v7
      with:
        repository: WaterLily-jl/WaterLily-Benchmarks
        ref: ${{ inputs.harness-ref }}
        path: ${{ inputs.harness-path }}
        persist-credentials: false
      env:
        GIT_LFS_SKIP_SMUDGE: "1"

    # -bs pairs BiotSavartBCs refs with the WaterLily ones; benchmark.sh checks them out in $BIOTSAVART_DIR
    - name: Check out BiotSavartBCs.jl (args contain -bs)
      if: contains(inputs.args, '-bs')
      uses: actions/checkout@v7
      with:
        repository: WaterLily-jl/BiotSavartBCs.jl
        path: BiotSavartBCs.jl
        fetch-depth: 0
        persist-credentials: false

    - name: Cache the git-LFS checkpoints
      uses: actions/cache@v6
      with:
        path: ${{ inputs.harness-path }}/.git/lfs
        key: waterlily-benchmarks-lfs-${{ hashFiles(format('{0}/checkpoints/*.jld2', inputs.harness-path)) }}
        restore-keys: waterlily-benchmarks-lfs-

    - uses: julia-actions/setup-julia@v3
      with:
        version: ${{ inputs.julia-version }}

    - uses: julia-actions/cache@v3

    - name: Benchmark ${{ inputs.base }} and ${{ inputs.head }}
      id: benchmark
      shell: bash
      working-directory: ${{ inputs.harness-path }}
      env:
        WATERLILY_DIR: ${{ inputs.waterlily-dir }}
        BIOTSAVART_DIR: ${{ github.workspace }}/BiotSavartBCs.jl
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        ARGS: ${{ inputs.args }}
        FORCE: ${{ inputs.force }}
      run: |
        read -r ARGS <<< "$ARGS"  # trim
        [[ $ARGS =~ ^[A-Za-z0-9\ ,._=\"-]*$ ]] || { echo "::error::unexpected characters in args: $ARGS"; exit 1; }
        DEFAULTS='-b Array -t "1 2" -r 2'  # CPU only, two thread counts, two repetitions; later values in ARGS win
        [[ $FORCE == true ]] && force=-f || force=
        echo "command=./benchmark.sh -w \"$BASE $HEAD\" -u true -dd data/ci $force $DEFAULTS $ARGS" >> "$GITHUB_OUTPUT"
        eval "set -- $DEFAULTS $ARGS"
        # The refs that run: -w and -bs in ARGS replace "$BASE $HEAD" (the last value wins, as in benchmark.sh)
        refs="$BASE $HEAD" bs_refs=
        for ((i = 1; i < $#; i++)); do
          j=$((i + 1))
          case ${!i} in -w|--waterlily) refs=${!j} ;; -bs|--biotsavart) bs_refs=${!j} ;; esac
        done
        { echo "refs=$refs"; echo "bs-refs=$bs_refs"; } >> "$GITHUB_OUTPUT"
        ./benchmark.sh -w "$BASE $HEAD" -u true -dd data/ci $force "$@"

    - name: Compare and write the report
      id: compare
      shell: bash
      working-directory: ${{ inputs.harness-path }}
      env:
        WATERLILY_DIR: ${{ inputs.waterlily-dir }}
        BIOTSAVART_DIR: ${{ github.workspace }}/BiotSavartBCs.jl  # names the BiotSavartBCs refs of a -bs run
        REFS: ${{ steps.benchmark.outputs.refs }}
        BS_REFS: ${{ steps.benchmark.outputs.bs-refs }}
        LABEL: ${{ inputs.label }}
        COMMAND: ${{ steps.benchmark.outputs.command }}
      run: |
        read -ra wl <<< "$REFS"; read -ra bs <<< "$BS_REFS"
        hash () { git -C "$1" rev-parse --short "$2^{commit}"; }
        vs () { local out=$1; shift; for x; do out+=" vs $x"; done; echo "$out"; }
        # One name per run, its WaterLily ref and with -bs its BiotSavartBCs ref, as compare.jl shows them.
        # The first run is the baseline, passed by hash: refs at the same commit share a name in compare.jl.
        names=() commits=() bs_commits=()
        for k in "${!wl[@]}"; do
          names+=("${wl[k]}${bs:+ (bs ${bs[k]})}")
          commits+=("${wl[k]} \`$(hash "$WATERLILY_DIR" "${wl[k]}")\`")
          [[ -z $bs ]] || bs_commits+=("${bs[k]} \`$(hash "$BIOTSAVART_DIR" "${bs[k]}")\`")
        done
        versions="WaterLily $(vs "${commits[@]}")${bs:+, BiotSavartBCs $(vs "${bs_commits[@]}")}"
        baseline=$(hash "$WATERLILY_DIR" "${wl[0]}")${bs:+,$(hash "$BIOTSAVART_DIR" "${bs[0]}")}
        julia --project compare.jl --data_dir=data/ci --markdown --speedup_base="$baseline" > tables.md
        {
          echo "<!-- waterlily-benchmarks${LABEL:+:$LABEL} -->"
          echo "## Benchmarks${LABEL:+ ($LABEL)}: $(vs "${names[@]}")"
          echo
          echo "$versions, \`$COMMAND\`, Julia $(julia -v | cut -d' ' -f3) on $RUNNER_OS ($RUNNER_NAME)," \
               "[run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          echo
          cat tables.md
          echo
          echo "<details><summary>Reading the table</summary>"
          echo
          echo "**Mean** is the time per step: the minimum over runs of the mean step of each run. **Δ ± σ** is the cost" \
               "difference with the ${names[0]} row of the same backend, positive is slower, and **Signif** = |Δ|/σ: below 1 it is" \
               "scatter, from 2 to 3 believe it. **Noise** is the scatter of the row and **Reps** the separate processes merged" \
               "into it. **Alloc** is only meaningful on CPUx01 (SIMD). The bold row is the speedup baseline, the italic one" \
               "the fastest of its backend. See the [methodology](https://github.com/WaterLily-jl/WaterLily-Benchmarks#measurement-methodology)."
          echo
          echo "</details>"
        } > report.md
        cat report.md >> "$GITHUB_STEP_SUMMARY"
        echo "report=$PWD/report.md" >> "$GITHUB_OUTPUT"
        echo "data=$PWD/data/ci" >> "$GITHUB_OUTPUT"

    - name: Upload the results
      if: inputs.artifact != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}
        path: |
          ${{ inputs.harness-path }}/data/ci
          ${{ inputs.harness-path }}/report.md

    - name: Post the report on the pull request
      if: inputs.pr != ''
      uses: actions/github-script@v9
      env:
        REPORT: ${{ steps.compare.outputs.report }}
        PR: ${{ inputs.pr }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const body = require('fs').readFileSync(process.env.REPORT, 'utf8');
          const marker = body.split('\n')[0];  // <!-- waterlily-benchmarks[:label] -->, one comment per label
          const {owner, repo} = context.repo;
          const issue_number = Number(process.env.PR);
          const find = async () => (await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100}))
            .find(c => c.body && c.body.startsWith(marker + '\n'));
          const existing = await find();
          try {
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
          } catch (error) {
            // The API can answer 5xx after the write went through (seen: a 502 with the comment posted), so check before failing
            const posted = await find();
            if (!posted || posted.body.trim() !== body.trim()) throw error;
            core.warning(`The API answered "${error.message}" but comment ${posted.id} is in place.`);
          }
