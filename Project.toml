# Benchmark environment. The plotting packages are in plotting/Project.toml (see util.jl: use_plotting_env), and GPU
# backends run in gpu/CUDA or gpu/AMDGPU, a copy of this environment plus the GPU package made by benchmark.sh.
[deps]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
BiotSavartBCs = "ec5a6caf-bdf7-41d0-b8e1-5fafde84e19f"
Glob = "c27321d9-0574-5035-807b-f59d2c89b15c"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
PrettyTables = "08abe8d2-0d0c-5749-adfa-8a2ac140af0d"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
WaterLily = "ed894a53-35f9-47f1-b17f-85db9237eebd"

# BiotSavartBCs (used by the `-biotsavart` cases) follows its main branch, not the registered release; `-bs` points it at a local clone
[sources]
BiotSavartBCs = {url = "https://github.com/WaterLily-jl/BiotSavartBCs.jl", rev = "main"}
